<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=EB+Garamond:400,400i,700|Cinzel:400,700">
    <title>Countdown</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #1a1510;
    background-image: 
        radial-gradient(ellipse at top, #2c2015 0%, #1a1510 60%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23a0845c' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'EB Garamond', serif;
}

.container {
    text-align: center;
    padding: 3rem 2rem;
}

.ornament {
    color: #a0845c;
    font-size: 1.4em;
    letter-spacing: 12px;
    margin-bottom: 0.5rem;
    opacity: 0.8;
}

.title {
    font-family: 'Cinzel', serif;
    color: #d4bc94;
    font-size: 0.75em;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
}

.subtitle {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    color: #8a7355;
    font-size: 1em;
    letter-spacing: 2px;
    margin-bottom: 2.5rem;
}

.divider {
    color: #a0845c;
    font-size: 0.9em;
    letter-spacing: 6px;
    margin: 1.5rem 0;
    opacity: 0.6;
}

#timer {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 1.5rem;
    flex-wrap: wrap;
}

.time-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
}

.box {
    background: #211c14;
    border: 1px solid #a0845c55;
    width: 110px;
    padding: 1.2rem 0.8rem 1rem;
    position: relative;
    box-shadow: 
        inset 0 0 30px rgba(0,0,0,0.4),
        0 0 20px rgba(160, 132, 92, 0.08);
}

.box::before {
    content: '';
    position: absolute;
    top: 4px;
    left: 4px;
    right: 4px;
    bottom: 4px;
    border: 1px solid #a0845c22;
    pointer-events: none;
}

.box::after {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 1px;
    background: #a0845c;
    opacity: 0.6;
}

.numbers {
    font-family: 'Cinzel', serif;
    font-size: 3em;
    font-weight: 700;
    color: #d4bc94;
    text-align: center;
    line-height: 1;
    text-shadow: 0 0 20px rgba(212, 188, 148, 0.15);
    min-width: 2ch;
    display: inline-block;
}

.label {
    font-family: 'EB Garamond', serif;
    color: #8a7355;
    font-size: 0.65em;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-top: 0.6rem;
    display: block;
}

.separator {
    font-family: 'Cinzel', serif;
    color: #a0845c44;
    font-size: 2.5em;
    margin-top: 0.6rem;
    line-height: 1.4;
}

.quote {
    margin-top: 2.5rem;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    color: #6b5c42;
    font-size: 0.95em;
    letter-spacing: 1px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.8;
}

.candle {
    margin-top: 1.5rem;
    font-size: 1.2em;
    opacity: 0.7;
    animation: flicker 3s infinite alternate;
}

@keyframes flicker {
    0%   { opacity: 0.6; }
    25%  { opacity: 0.75; }
    50%  { opacity: 0.65; }
    75%  { opacity: 0.8; }
    100% { opacity: 0.7; }
}
    </style>
</head>
<body>

<div class="container">
    <div class="ornament">— ✦ —</div>
    <div class="title">Counting the Days</div>
    <div class="subtitle">until the appointed hour</div>

    <div id="timer">
        <div class="time-block">
            <div class="box">
                <div id="days" class="numbers">00</div>
                <span class="label">Days</span>
            </div>
        </div>

        <div class="separator">·</div>

        <div class="time-block">
            <div class="box">
                <div id="hours" class="numbers">00</div>
                <span class="label">Hours</span>
            </div>
        </div>

        <div class="separator">·</div>

        <div class="time-block">
            <div class="box">
                <div id="minutes" class="numbers">00</div>
                <span class="label">Minutes</span>
            </div>
        </div>

        <div class="separator">·</div>

        <div class="time-block">
            <div class="box">
                <div id="seconds" class="numbers">00</div>
                <span class="label">Seconds</span>
            </div>
        </div>
    </div>

    <div class="divider">⸻ ✦ ⸻</div>
    <div class="quote">"There is no charm equal to tenderness of heart."<br>— Jane Austen</div>
    <div class="candle">🕯️</div>
</div>

<script>
const myDate = new Date('Jun 23, 2026 00:00:00');

function pad(n) {
    return n < 10 ? '0' + n : n;
}

let timer = setInterval(function() {
    const today = new Date().getTime();
    const diff = myDate - today;

    if (diff <= 0) {
        clearInterval(timer);
        document.getElementById("days").innerHTML = "00";
        document.getElementById("hours").innerHTML = "00";
        document.getElementById("minutes").innerHTML = "00";
        document.getElementById("seconds").innerHTML = "00";
        return;
    }

    let days    = Math.floor(diff / (1000 * 60 * 60 * 24));
    let hours   = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    let minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    let seconds = Math.floor((diff % (1000 * 60)) / 1000);

    document.getElementById("days").innerHTML    = pad(days);
    document.getElementById("hours").innerHTML   = pad(hours);
    document.getElementById("minutes").innerHTML = pad(minutes);
    document.getElementById("seconds").innerHTML = pad(seconds);
}, 1000);
</script>
</body>
</html>
